[tool.poetry]
name = "brazilian-economic-data-pipeline"
version = "0.1.0"
description = "Pipeline de dados econômicos do Brasil com Flask, dbt e PostgreSQL"
authors = ["Juan Mangueira juanmangueira@outlook.com"]
license = "MIT"
packages = [{ include = "economic_pipeline", from = "src" }]

[tool.poetry.dependencies]
python = "3.12"
flask = "3.1.1"
pandas = "2.3.1"
requests = "2.32.4"
sqlalchemy = "2.0.41"
psycopg2-binary = "2.9.10"
python-dotenv = "1.1.1"

[tool.poetry.group.dbt.dependencies]
dbt-core = "1.10.4"
dbt-postgres = "1.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
